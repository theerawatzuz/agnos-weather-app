name: Build and Push Docker Image

on:
  push:
    branches:
      - dev
      - uat
      - production
    tags:
      - "v*"
  pull_request:
    branches:
      - dev
      - uat
      - production
  workflow_dispatch:

env:
  IMAGE_NAME: weather-ingest

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Generate tag with auto-increment version
        id: tag
        run: |
          # Get latest tag from Docker Hub
          REPO="${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}"

          # Fetch tags from Docker Hub API
          TAGS=$(curl -s "https://hub.docker.com/v2/repositories/${REPO}/tags/?page_size=100" | \
                 jq -r '.results[].name' | \
                 grep "^v[0-9]*$" | \
                 sort -V | \
                 tail -1)

          if [ -z "$TAGS" ]; then
            # No previous version found, start with v1
            VERSION=1
          else
            # Extract version number and increment
            CURRENT_VERSION=$(echo $TAGS | sed "s/v//")
            VERSION=$((CURRENT_VERSION + 1))
          fi

          TAG="v${VERSION}"
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "Generated tag: $TAG (previous: ${TAGS:-none})"

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:${{ steps.tag.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Push Docker image
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:${{ steps.tag.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Image details
        if: github.event_name != 'pull_request'
        run: |
          echo "Image pushed successfully!"
          echo "Image: ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:${{ steps.tag.outputs.tag }}"

      - name: Update manifest in GitOps repo
        if: github.event_name != 'pull_request'
        run: |
          BRANCH=${GITHUB_REF#refs/heads/}
          IMAGE_TAG="${{ steps.tag.outputs.tag }}"

          # Clone GitOps repo
          git clone https://${{ secrets.GITOPS_TOKEN }}@github.com/${{ secrets.GITOPS_REPO }}.git gitops
          cd gitops

          # Checkout appropriate branch
          git checkout ${BRANCH}

          # Update image tag in manifest
          MANIFEST_PATH="03-argocd-apps/manifests/app-weather/templates/deployment.yaml"
          sed -i "s|image: bankt21/weather-ingest:.*|image: bankt21/weather-ingest:${IMAGE_TAG}|g" ${MANIFEST_PATH}

          # Commit and push
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add ${MANIFEST_PATH}
          git commit -m "chore: update weather-ingest image to ${IMAGE_TAG}"
          git push origin ${BRANCH}

          echo "Updated manifest in GitOps repo (${BRANCH} branch)"
